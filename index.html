<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080808" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Getting Buckets" />
    <title>Getting Buckets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --red:     #CE1141;
        --red-dim: #CE114122;
        --bg:      #080808;
        --card:    #111111;
        --input:   #181818;
        --border:  #1e1e1e;
        --border2: #2a2a2a;
      }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; padding: 0; background: var(--bg); }
      body { font-family: 'DM Sans', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; color: #fff; }
      input, select, button { font-family: inherit; }
      input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
      ::-webkit-scrollbar { width: 3px; height: 3px; }
      ::-webkit-scrollbar-track { background: var(--bg); }
      ::-webkit-scrollbar-thumb { background: var(--red); border-radius: 2px; }

      .module-scroll { flex: 1; overflow-y: auto; padding: 16px 16px 24px; -webkit-overflow-scrolling: touch; }

      .text-input {
        width: 100%; background: var(--input); border: 1px solid var(--border2);
        border-radius: 8px; color: #fff; padding: 9px 12px; font-size: 14px; transition: border-color 0.2s;
      }
      .text-input:focus { outline: none; border-color: var(--red); }

      .btn-primary {
        background: var(--red); color: #fff; font-weight: 700; border: none;
        border-radius: 12px; padding: 13px 20px; font-size: 15px; cursor: pointer;
        transition: all 0.15s; font-family: 'Bebas Neue', cursive; letter-spacing: 1.5px;
      }
      .btn-primary:hover { background: #e8164a; transform: translateY(-1px); }
      .btn-primary:active { transform: translateY(0); }
      .btn-primary:disabled { background: #2a0a12; color: #555; transform: none; cursor: default; }

      .btn-ghost {
        background: transparent; border: 1px solid var(--border2); color: #888;
        border-radius: 12px; padding: 10px 16px; font-size: 14px; cursor: pointer; transition: all 0.15s;
      }
      .btn-ghost:hover { border-color: var(--red); color: var(--red); }
      .btn-full { width: 100%; }

      .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; }
      .badge-red { background: rgba(206,17,65,0.15); color: var(--red); }

      .list-row {
        background: var(--card); border: 1px solid var(--border); border-radius: 14px;
        margin-bottom: 9px; cursor: pointer; display: flex; align-items: center;
        gap: 12px; transition: border-color 0.2s; overflow: hidden;
      }
      .list-row:hover { border-color: var(--red); }

      .jersey-badge {
        width: 40px; height: 40px; border-radius: 12px; display: flex;
        align-items: center; justify-content: center;
        font-family: 'Bebas Neue', cursive; font-size: 17px; color: #fff; flex-shrink: 0;
      }

      .alert-red {
        background: #130007; border: 1px solid var(--red);
        border-radius: 12px; padding: 11px 14px; margin-bottom: 14px; color: var(--red); font-size: 13px;
      }

      .drop-zone {
        border: 2px dashed var(--border2); border-radius: 18px; padding: 28px 20px;
        text-align: center; cursor: pointer; transition: all 0.2s; background: #0d0d0d; margin-bottom: 14px;
      }
      .drop-zone:hover, .drop-zone--filled { border-color: var(--red); background: #130007; }

      tr:hover td { background: #161616 !important; }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

      .buckets-spinner {
        width: 36px; height: 36px;
        border: 3px solid #2a0a12;
        border-top-color: var(--red);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
