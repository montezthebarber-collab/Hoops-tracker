<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hoops Tracker" />
    <title>Hoops Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; padding: 0; background: #0d0d0d; }
      body { font-family: 'DM Sans', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
      input, select, button { font-family: inherit; }
      input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
      ::-webkit-scrollbar { width: 3px; height: 3px; }
      ::-webkit-scrollbar-track { background: #0d0d0d; }
      ::-webkit-scrollbar-thumb { background: #f97316; border-radius: 2px; }
      .module-scroll { flex: 1; overflow-y: auto; padding: 16px 16px 24px; -webkit-overflow-scrolling: touch; }
      .text-input { width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; color: #fff; padding: 9px 12px; font-size: 14px; transition: border-color 0.2s; }
      .text-input:focus { outline: none; border-color: #f97316; }
      .btn-primary { background: #f97316; color: #000; font-weight: 700; border: none; border-radius: 12px; padding: 13px 20px; font-size: 15px; cursor: pointer; transition: all 0.15s; font-family: 'Bebas Neue', cursive; letter-spacing: 1.5px; }
      .btn-primary:hover { background: #fb923c; transform: translateY(-1px); }
      .btn-primary:disabled { background: #333; color: #666; transform: none; cursor: default; }
      .btn-ghost { background: transparent; border: 1px solid #2a2a2a; color: #aaa; border-radius: 12px; padding: 10px 16px; font-size: 14px; cursor: pointer; transition: all 0.15s; }
      .btn-ghost:hover { border-color: #f97316; color: #f97316; }
      .btn-full { width: 100%; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; }
      .badge-red { background: rgba(239,68,68,0.15); color: #ef4444; }
      .list-row { background: #161616; border: 1px solid #222; border-radius: 14px; margin-bottom: 9px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: border-color 0.2s; overflow: hidden; }
      .list-row:hover { border-color: #f97316; }
      .jersey-badge { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', cursive; font-size: 17px; color: #000; flex-shrink: 0; }
      .alert-red { background: #1f0e0e; border: 1px solid #ef4444; border-radius: 12px; padding: 11px 14px; margin-bottom: 14px; color: #ef4444; font-size: 13px; }
      .drop-zone { border: 2px dashed #2a2a2a; border-radius: 18px; padding: 28px 20px; text-align: center; cursor: pointer; transition: all 0.2s; background: #111; margin-bottom: 14px; }
      .drop-zone:hover, .drop-zone--filled { border-color: #f97316; background: #1a1000; }
      tr:hover td { background: #1a1a1a !important; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
      .hoop-spinner { width: 36px; height: 36px; border: 3px solid #1e1e1e; border-top-color: #f97316; border-radius: 50%; animation: spin 1s linear infinite; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
